name: Vigía

# El Vigía corre SOLO cuando tú se lo pides por el chat.
#
# Telegram → Cloudflare Worker (vigia/worker.js) → repository_dispatch → este
# workflow. Sin cron y sin sesiones de escucha: nada corre mientras no mandes
# un mensaje.
#
# La bitácora (el artefacto) no puede disparar workflows: el conector de GitHub
# de claude.ai no expone las herramientas de Actions. Lo que sí puede es escribir
# un archivo, así que deja la orden en vigia/orden.json y el push de ese archivo
# levanta este workflow. El bot nunca commitea orden.json, así que no hay bucle.
#
# También puedes dispararlo a mano desde la pestaña Actions (Run workflow).

on:
  repository_dispatch:
    types: [comando]
  push:
    paths: ['vigia/orden.json']
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué hacer'
        type: choice
        default: barrer
        options: [barrer, rapido, tablero, estado]
      texto:
        description: 'Comando libre (opcional, manda sobre la acción)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # el texto entra por variable de entorno, nunca interpolado en el shell
      - name: Resolver el comando
        env:
          DESDE_EVENTO: ${{ github.event.client_payload.texto || inputs.texto || inputs.accion || 'barrer' }}
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            TXT=$(node -e 'let t="barrer";try{t=String(require("./vigia/orden.json").texto||t)}catch{};
              console.log(t.replace(/[^\w .:-]/g,"").slice(0,40).trim()||"barrer")')
          else
            TXT=$DESDE_EVENTO
          fi
          echo "orden: $TXT"
          echo "COMANDO=$TXT" >> "$GITHUB_ENV"

      - name: Atender el comando
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: comando
        run: node vigia/vigia.mjs

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "vigia-bot"
          git config user.email "vigia@users.noreply.github.com"
          git add vigia/estado.json
          [ -f vigia/registro.json ] && git add vigia/registro.json || true
          [ -f vigia/mesa.json ] && git add vigia/mesa.json || true
          [ -f vigia/itf.json ] && git add vigia/itf.json || true
          [ -f vigia/corrida.json ] && git add vigia/corrida.json || true
          [ -f vigia/live.json ] && git add vigia/live.json || true
          git diff --cached --quiet && exit 0
          git commit -q -m "vigia: estado $(date -u +%H:%M)"
          git pull -q --rebase origin "$GITHUB_REF_NAME" || true
          git push -q origin "HEAD:$GITHUB_REF_NAME" || echo "push del estado falló"
