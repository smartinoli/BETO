name: Vigía

on:
  schedule:
    # UTC. Chile (America/Santiago) es UTC-4 en invierno austral / UTC-3 en verano.
    # marcapasos: editado a mano para registrar el cron.
    # Cubre ~09:00 a ~01:00 hora chilena; el script además verifica el horario
    # en hora de Santiago y se apaga solo fuera de rango (así el cambio de
    # horario de verano no obliga a tocar nada acá).
    #
    # GitHub SALTA ventanas de cron cuando hay carga (en pruebas dispararon 3
    # de 8). Por eso cada ejecución es un TURNO de varios ciclos: aunque el
    # scheduler falle, la cadencia real se mantiene.
    - cron: '7,37 12-23 * * *'
    - cron: '7,37 0-5 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'vigia/vigia.mjs'
      - 'vigia/config.json'
      - '.github/workflows/vigia.yml'

permissions:
  contents: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Turno del Vigía
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CICLOS: 3
          ESPERA: 720
        run: |
          git config user.name "vigia-bot"
          git config user.email "vigia@users.noreply.github.com"
          for i in $(seq 1 "$CICLOS"); do
            echo "::group::Ciclo $i de $CICLOS"
            set +e
            node vigia/vigia.mjs
            rc=$?
            set -e
            echo "::endgroup::"
            # el estado se guarda aunque el ciclo falle: la memoria no se pierde
            git add vigia/estado.json
            if ! git diff --cached --quiet; then
              git commit -q -m "vigia: estado $(date -u +%H:%M)"
              git pull -q --rebase origin "$GITHUB_REF_NAME" || true
              git push -q origin "HEAD:$GITHUB_REF_NAME" || echo "push del estado falló, sigue el turno"
            fi
            if [ "$rc" -eq 3 ]; then echo "Fuera de horario: turno terminado."; break; fi
            if [ "$i" -lt "$CICLOS" ]; then sleep "$ESPERA"; fi
          done
