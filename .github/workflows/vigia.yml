name: Vigía

# El Vigía ya no manda alertas solo: ESCUCHA tu chat de Telegram y barre
# cuando tú se lo pides (/barrer, /rapido, /estado).
#
# Cada ejecución mantiene al bot escuchando ~28 minutos sin gastar un solo
# request de OddsPapi. El cron levanta un escucha nuevo cada 30 minutos, así
# que casi siempre hay uno vivo. Si mandas un comando cuando no lo hay, el
# mensaje NO se pierde: Telegram lo guarda y el siguiente escucha lo atiende.

on:
  schedule:
    # UTC. Chile es UTC-4 (invierno) / UTC-3 (verano) → cubre ~08:00-02:00 local.
    - cron: '5,35 11-23 * * *'
    - cron: '5,35 0-6 * * *'
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué hacer ahora'
        type: choice
        default: escucha
        options: [escucha, barrer, rapido]

permissions:
  contents: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vigía
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: ${{ inputs.accion || 'escucha' }}
          SEGUNDOS_ESCUCHA: 1680
        run: node vigia/vigia.mjs

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "vigia-bot"
          git config user.email "vigia@users.noreply.github.com"
          git add vigia/estado.json
          git diff --cached --quiet && exit 0
          git commit -q -m "vigia: estado $(date -u +%H:%M)"
          git pull -q --rebase origin "$GITHUB_REF_NAME" || true
          git push -q origin "HEAD:$GITHUB_REF_NAME" || echo "push del estado falló"
