name: Tabla ITF

# La tabla del día, online y con un botón.
#
# Dos maneras de refrescarla:
#   · BOTÓN — Actions → "Tabla ITF" → Run workflow: corre la rutina completa
#     (marcadores de ayer, cuotas bet365 vigentes, veredictos y decantador),
#     guarda los datos en la rama y re-publica la página.
#   · SOLA — cuando la rutina diaria commitea vigia/itf-informe.html, acá
#     solo se re-publica la página, sin gastar requests de la API.
#
# La página queda en GitHub Pages: https://smartinoli.github.io/BETO/
# Requisitos (una sola vez): el secret ODDSPAPI_KEY (ya existe, lo usa el
# workflow Vigía) y Settings → Pages → Source: GitHub Actions.

on:
  workflow_dispatch:
    inputs:
      que:
        description: 'Qué refrescar'
        type: choice
        default: cuotas
        # cuotas = mejor casa disponible (bet365 > betano > …), sirve para medir el mercado
        # betano = SOLO precios de Betano, que son los que Sebastián puede jugar
        # todo   = además scrape de cuadros ITF (lento)
        # modelo = reajusta las constantes con los resultados acumulados
        options: [cuotas, betano, todo, modelo]
  # Sin schedule a pedido de Sebastián (2026-08-27): todo manual, él actualiza
  # con los botones de la página (o desde esta pestaña de Actions).
  push:
    branches: [claude/itf-scrapers-prize-money-7oy59k]
    paths: [vigia/itf-informe.html, vigia/itf-tabla.html]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tabla-itf
  cancel-in-progress: false

jobs:
  correr:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/itf-scrapers-prize-money-7oy59k

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Chromium para el WAF de la ITF
        if: inputs.que == 'todo'
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      # Los pasos de scrape son MEJOR ESFUERZO: el || echo cubre el error del
      # comando, pero si el paso muere por timeout el || nunca corre y el job
      # entero caía (pasó el 2026-08-29, dos corridas del botón). El
      # continue-on-error cubre ese caso: con lo que se alcanzó a bajar, se sigue.
      - name: Calendario y mapa (así aparecen las semanas nuevas)
        if: inputs.que == 'todo'
        timeout-minutes: 6
        continue-on-error: true
        run: |
          node vigia/itf-navegador.mjs calendario || echo "calendario no refrescó; se sigue con el caché"
          node vigia/itf-mapa.mjs

      - name: Entry lists de torneos vivos y próximos (la foto antes de que ITF la borre)
        if: inputs.que == 'todo'
        timeout-minutes: 10
        continue-on-error: true
        run: node vigia/itf-navegador.mjs cosecha || echo "cosecha parcial; se sigue"

      - name: Tablas de torneos (cuadros y programación, vía navegador)
        if: inputs.que == 'todo'
        timeout-minutes: 14
        continue-on-error: true
        run: node vigia/itf-navegador.mjs oop || echo "la ITF no dejó refrescar todo; se sigue con lo que hay"

      - name: El rating propio (Elo) se reconstruye con los cuadros frescos
        if: inputs.que == 'todo'
        run: node vigia/itf-rating.mjs

      # NO se refrescan cuadros en el camino de cuotas (quitado el 2026-09-01).
      # Lo habiamos metido para mantener las fases al dia, pero recorre 35
      # torneos con pausas y el WAF lo hace tardar: a Sebastian le tomo 5m13s
      # un boton que promete 2-3 minutos, y ya habia tumbado dos corridas por
      # timeout. Las fases salen del boton "Torneos y cuadros", que es
      # exactamente para eso. El de cuotas hace lo suyo: API, partidos, tabla.

      # El modelo aprende: reajusta sus constantes con el banco al día y las
      # aplica SOLO si le ganan a las anteriores en la validación. Si no
      # mejora, el script lo dice y no escribe nada.
      - name: El modelo aprende de los resultados
        if: inputs.que == 'modelo'
        timeout-minutes: 15
        run: node vigia/itf-aprender.mjs

      - name: La rutina del día
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        # con 'betano' la tanda se arma solo con sus precios; en el resto
        # manda la prioridad de casas de siempre
        run: |
          if [ "${{ inputs.que }}" = "betano" ]; then
            node vigia/itf-dia.mjs --casa betano
          else
            node vigia/itf-dia.mjs
          fi

      - name: Guardar lo que cambió
        run: |
          git config user.name "vigia-bot"
          git config user.email "vigia@users.noreply.github.com"
          git add vigia/itf-informe.html vigia/itf-tabla.html vigia/itf-tabla.json vigia/datos/itf/modelo-aprendido.json vigia/itf-veredictos.json vigia/itf-cuotas-bet365.json vigia/itf-calendario.json vigia/datos/itf
          git diff --cached --quiet && exit 0
          git commit -q -m "tabla: corrida a pedido $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull -q --rebase origin claude/itf-scrapers-prize-money-7oy59k || true
          git push -q origin HEAD:claude/itf-scrapers-prize-money-7oy59k

  publicar:
    needs: correr
    # en push "correr" queda skipped y acá se publica igual; solo se frena si corrió y falló
    if: always() && needs.correr.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/itf-scrapers-prize-money-7oy59k

      - name: Armar el sitio (la tabla es la portada)
        run: |
          mkdir -p _sitio
          cp vigia/itf-informe.html _sitio/index.html
          cp vigia/itf-tabla.html _sitio/tabla.html || true
          cp vigia/itf-auditoria.html _sitio/auditoria.html || true

      - uses: actions/configure-pages@v5
        with:
          enablement: enabled

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - id: deploy
        uses: actions/deploy-pages@v4
